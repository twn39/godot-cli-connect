[project]
name = "godot-cli-connect"
version = "0.1.0"
description = "CLI Bridge Tool connecting AI Agents with Godot Engine 4.x runtime"
readme = "README.md"
authors = [
    { name = "curry tang", email = "curry_tang@apple.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.8",
    "pillow>=12.3.0",
    "rich>=15.0.0",
    "typer>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[project.scripts]
godot-cli = "godot_cli_connect.cli:app"
godot-cli-connect = "godot_cli_connect.cli:app"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",   # line length handled loosely for GDScript templates
    "B904",   # raise-from noise in CLI adapters
    "BLE001", # intentional broad catch → offline fallback / agent err dicts
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

